<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="Muslim Model School Khaddi – Admin Dashboard with real-time stats, charts, and activity feed."/>
  <title>Dashboard – Muslim Model School Khaddi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="app-layout" id="appLayout"></div>
<div id="toastContainer" class="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const session = Auth.requireAuth();
if (session) {
  document.getElementById('appLayout').innerHTML = buildSidebar() + `
  <div class="main-content">
    ${buildHeader('Dashboard')}
    <div class="page-content" id="pageContent"></div>
  </div>`;
  setupLayout('dashboard');
  renderDashboard();
}

function renderDashboard() {
  const students  = DB.get('students');
  const teachers  = DB.get('teachers');
  const classes   = DB.get('classes');
  const fees      = DB.get('fees');
  const notices   = DB.get('notices');
  const activities= DB.get('activities');
  const attendance= DB.get('attendance');

  const todayStr  = today();
  const todayAtt  = attendance.filter(a => a.date === todayStr && a.type === 'student');
  const present   = todayAtt.filter(a => a.status === 'present').length;
  const absent    = todayAtt.filter(a => a.status === 'absent').length;
  const unpaidFees= fees.filter(f => f.status === 'unpaid');
  const paidFees  = fees.filter(f => f.status === 'paid');
  const totalDue  = unpaidFees.reduce((s,f)=>s+f.amount, 0);
  const totalColl = paidFees.reduce((s,f)=>s+f.amount, 0);
  const attRate   = students.length > 0 ? Math.round((present / Math.max(todayAtt.length,1)) * 100) : 88;

  document.getElementById('pageContent').innerHTML = `
  <div class="page-header">
    <div class="page-header-left">
      <p class="breadcrumb">Home / <span>Dashboard</span></p>
      <h2>Welcome back, ${session.name.split(' ')[0]}! 👋</h2>
      <p>Here's what's happening at your school today.</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span style="font-size:13px;color:var(--text-light)"><i class="fas fa-calendar-day" style="color:var(--primary)"></i> ${new Date().toLocaleDateString('en-PK',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</span>
      ${Auth.isAdmin() ? `<button class="btn btn-outline btn-sm" onclick="DB.reset();location.reload()"><i class="fas fa-redo"></i> Reset Demo</button>` : ''}
    </div>
  </div>

  <!-- STAT CARDS -->
  <div class="stat-cards">
    <div class="stat-card" onclick="navigateTo('students')" style="cursor:pointer">
      <div class="stat-icon blue"><i class="fas fa-user-graduate"></i></div>
      <div class="stat-info">
        <div class="stat-number" id="cntStudents">${students.length}</div>
        <div class="stat-label">Total Students</div>
        <div class="stat-trend up"><i class="fas fa-arrow-up"></i> 3 this month</div>
      </div>
    </div>
    <div class="stat-card" onclick="navigateTo('teachers')" style="cursor:pointer">
      <div class="stat-icon green"><i class="fas fa-chalkboard-teacher"></i></div>
      <div class="stat-info">
        <div class="stat-number">${teachers.length}</div>
        <div class="stat-label">Total Teachers</div>
        <div class="stat-trend up"><i class="fas fa-arrow-up"></i> Active staff</div>
      </div>
    </div>
    <div class="stat-card" onclick="navigateTo('classes')" style="cursor:pointer">
      <div class="stat-icon orange"><i class="fas fa-school"></i></div>
      <div class="stat-info">
        <div class="stat-number">${classes.length}</div>
        <div class="stat-label">Total Classes</div>
        <div class="stat-trend up"><i class="fas fa-check"></i> All active</div>
      </div>
    </div>
    <div class="stat-card" onclick="navigateTo('attendance')" style="cursor:pointer">
      <div class="stat-icon purple"><i class="fas fa-calendar-check"></i></div>
      <div class="stat-info">
        <div class="stat-number">${attRate}%</div>
        <div class="stat-label">Today Attendance</div>
        <div class="stat-trend ${attRate>=80?'up':'down'}"><i class="fas fa-arrow-${attRate>=80?'up':'down'}"></i> ${present} present, ${absent} absent</div>
      </div>
    </div>
    <div class="stat-card" onclick="navigateTo('fees')" style="cursor:pointer">
      <div class="stat-icon red"><i class="fas fa-file-invoice-dollar"></i></div>
      <div class="stat-info">
        <div class="stat-number">Rs.${(totalDue/1000).toFixed(0)}K</div>
        <div class="stat-label">Fees Due</div>
        <div class="stat-trend down"><i class="fas fa-exclamation"></i> ${unpaidFees.length} pending</div>
      </div>
    </div>
    <div class="stat-card" onclick="navigateTo('fees')" style="cursor:pointer">
      <div class="stat-icon cyan"><i class="fas fa-money-bill-wave"></i></div>
      <div class="stat-info">
        <div class="stat-number">Rs.${(totalColl/1000).toFixed(0)}K</div>
        <div class="stat-label">Fees Collected</div>
        <div class="stat-trend up"><i class="fas fa-arrow-up"></i> This month</div>
      </div>
    </div>
    <div class="stat-card" onclick="navigateTo('noticeboard')" style="cursor:pointer">
      <div class="stat-icon pink"><i class="fas fa-bullhorn"></i></div>
      <div class="stat-info">
        <div class="stat-number">${notices.length}</div>
        <div class="stat-label">Active Notices</div>
        <div class="stat-trend up"><i class="fas fa-bell"></i> See all</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue"><i class="fas fa-users"></i></div>
      <div class="stat-info">
        <div class="stat-number">${students.length + teachers.length + 5}</div>
        <div class="stat-label">Total Staff & Students</div>
        <div class="stat-trend up"><i class="fas fa-check"></i> All registered</div>
      </div>
    </div>
  </div>

  <div class="grid-2" style="margin-bottom:20px">
    <!-- ATTENDANCE CHART -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-chart-bar"></i> Monthly Attendance (Oct 2026)</h3>
      </div>
      <div class="card-body">
        <div class="chart-container">
          <div class="bar-chart" id="attBarChart"></div>
        </div>
        <div style="display:flex;gap:20px;margin-top:12px;justify-content:center;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--primary);display:inline-block"></span>Present</span>
          <span style="font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--danger);display:inline-block"></span>Absent</span>
          <span style="font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--warning);display:inline-block"></span>Leave</span>
        </div>
      </div>
    </div>

    <!-- FEE COLLECTION DONUT -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-chart-pie"></i> Fee Collection Status</h3>
      </div>
      <div class="card-body">
        <div class="donut-chart-wrap">
          <svg class="donut-svg" width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="50" fill="none" stroke="#e2e8f0" stroke-width="20"/>
            <circle cx="65" cy="65" r="50" fill="none" stroke="var(--primary)" stroke-width="20"
              stroke-dasharray="${(paidFees.length/(fees.length||1))*314.16} 314.16"
              stroke-dashoffset="78.54" transform="rotate(-90 65 65)" style="transition:stroke-dasharray .8s ease"/>
            <circle cx="65" cy="65" r="50" fill="none" stroke="var(--danger)" stroke-width="20"
              stroke-dasharray="${(unpaidFees.length/(fees.length||1))*314.16} 314.16"
              stroke-dashoffset="${78.54 - (paidFees.length/(fees.length||1))*314.16}" transform="rotate(-90 65 65)" style="transition:stroke-dasharray .8s ease"/>
            <text x="65" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="var(--text-dark)">${fees.length>0?Math.round((paidFees.length/fees.length)*100):0}%</text>
            <text x="65" y="76" text-anchor="middle" font-size="10" fill="var(--text-light)">Collected</text>
          </svg>
          <div class="donut-legend">
            <div class="legend-item">
              <span class="legend-dot" style="background:var(--primary)"></span>
              <span class="legend-label">Paid</span>
              <span class="legend-value" style="margin-left:20px">${paidFees.length}</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot" style="background:var(--danger)"></span>
              <span class="legend-label">Unpaid</span>
              <span class="legend-value" style="margin-left:20px">${unpaidFees.length}</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot" style="background:var(--success)"></span>
              <span class="legend-label">Total</span>
              <span class="legend-value" style="margin-left:20px">${fees.length}</span>
            </div>
            <hr style="border:none;border-top:1px solid var(--border);margin:8px 0"/>
            <div class="legend-item">
              <span class="legend-label">Collected</span>
              <span class="legend-value" style="margin-left:20px;color:var(--success)">Rs.${totalColl.toLocaleString()}</span>
            </div>
            <div class="legend-item">
              <span class="legend-label">Due</span>
              <span class="legend-value" style="margin-left:20px;color:var(--danger)">Rs.${totalDue.toLocaleString()}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid-2" style="margin-bottom:20px">
    <!-- RECENT ACTIVITIES -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-clock"></i> Recent Activities</h3>
        <button class="btn btn-outline btn-sm">View All</button>
      </div>
      <div class="card-body" style="padding-top:8px">
        <div class="activity-list">
          ${activities.slice(0,6).map(a=>`
          <div class="activity-item">
            <div class="activity-dot" style="background:${a.color}"></div>
            <div class="activity-content">
              <div class="title">${a.title}</div>
              <div class="time"><i class="fas fa-clock" style="font-size:10px"></i> ${a.time}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- NOTICE BOARD PREVIEW -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-bullhorn"></i> Latest Notices</h3>
        <button class="btn btn-outline btn-sm" onclick="navigateTo('noticeboard')">View All</button>
      </div>
      <div class="card-body" style="padding-top:8px">
        ${notices.slice(0,3).map(n=>`
        <div class="notice-item ${n.type==='urgent'?'urgent':n.type==='event'?'success':''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div class="notice-title">${n.title}</div>
            <span class="badge ${n.type==='urgent'?'badge-danger':n.type==='event'?'badge-success':'badge-primary'}">${n.type}</span>
          </div>
          <div class="notice-date"><i class="fas fa-calendar-alt"></i> ${formatDate(n.date)}</div>
          <div class="notice-body">${n.body.substring(0,80)}...</div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <!-- QUICK ACTIONS -->
  ${Auth.isAdmin() || Auth.isTeacher() ? `
  <div class="card">
    <div class="card-header">
      <h3><i class="fas fa-bolt"></i> Quick Actions</h3>
    </div>
    <div class="card-body">
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        <button class="btn btn-primary" onclick="navigateTo('students')"><i class="fas fa-user-plus"></i> Add Student</button>
        <button class="btn btn-success" onclick="navigateTo('attendance')"><i class="fas fa-calendar-check"></i> Mark Attendance</button>
        <button class="btn btn-warning" onclick="navigateTo('fees')"><i class="fas fa-money-bill"></i> Record Fee</button>
        <button class="btn btn-outline" onclick="navigateTo('exams')"><i class="fas fa-graduation-cap"></i> Add Result</button>
        <button class="btn btn-outline" onclick="navigateTo('noticeboard')"><i class="fas fa-bullhorn"></i> Post Notice</button>
        <button class="btn btn-outline" onclick="navigateTo('classes')"><i class="fas fa-school"></i> Manage Classes</button>
      </div>
    </div>
  </div>` : ''}

  <!-- CLASS SUMMARY TABLE -->
  <div class="card" style="margin-top:20px">
    <div class="card-header">
      <h3><i class="fas fa-school"></i> Class Summary</h3>
      <button class="btn btn-outline btn-sm" onclick="navigateTo('classes')">Manage Classes</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Class</th><th>Class Teacher</th><th>Enrolled</th><th>Capacity</th><th>Fill Rate</th></tr></thead>
        <tbody>
          ${classes.map(c=>{
            const teacher = DB.findOne('teachers', t=>t.id===c.teacher);
            const pct = Math.round((c.enrolled/c.capacity)*100);
            return `<tr>
              <td><span class="badge badge-primary">${c.name}</span></td>
              <td>${teacher?teacher.name:'–'}</td>
              <td>${c.enrolled}</td>
              <td>${c.capacity}</td>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="progress-bar-wrap" style="flex:1">
                    <div class="progress-bar ${pct>80?'green':pct>60?'blue':'orange'}" style="width:${pct}%"></div>
                  </div>
                  <span style="font-size:12px;font-weight:600;color:var(--text-mid)">${pct}%</span>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>
  `;

  // Build bar chart
  buildAttBarChart();
}

function buildAttBarChart() {
  const months = ['W1','W2','W3','W4'];
  const data   = [
    {present:42,absent:5,leave:3},
    {present:45,absent:3,leave:2},
    {present:40,absent:8,leave:2},
    {present:44,absent:4,leave:2},
  ];
  const maxVal = 50;
  const chart = document.getElementById('attBarChart');
  if (!chart) return;
  chart.innerHTML = data.map((d,i)=>`
    <div class="bar-group">
      <div style="display:flex;align-items:flex-end;gap:2px;height:140px;width:100%">
        <div class="bar" style="background:var(--primary);height:${(d.present/maxVal)*140}px;flex:1" data-val="${d.present} present"></div>
        <div class="bar" style="background:var(--danger);height:${(d.absent/maxVal)*140}px;flex:1" data-val="${d.absent} absent"></div>
        <div class="bar" style="background:var(--warning);height:${(d.leave/maxVal)*140}px;flex:1" data-val="${d.leave} leave"></div>
      </div>
      <div class="bar-label">${months[i]}</div>
    </div>
  `).join('');
}
</script>
</body>
</html>
